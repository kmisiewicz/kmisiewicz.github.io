title: Krzysztof Misiewicz
tagline: Unity Developer
description: Portfolio of Krzysztof Misiewicz, a Unity developer building games, editor tools and VR projects.
url: https://kmisiewicz.github.io
baseurl: ""
lang: en
avatar: /images/author.jpg
logo: /images/author.jpg
author:
  name: Krzysztof Misiewicz

# Home page hero
headline: Games, editor tools and VR experiments
intro: >-
  I'm a Unity developer with over 4 years of commercial experience on PC and mobile games.
  Below are projects, tools and experiments I've built along the way.

# Accent palette: cyan, violet, amber, rose, lime, emerald
accent: cyan

# Icon links in the header, hero and footer. Leave a value empty to hide it.
socials:
  github: kmisiewicz
  linkedin: krzysztof-misiewicz
  email: k.misiewicz97@gmail.com
  soundcloud: crysis1331
  youtube: # channel handle, e.g. "@yourname"

# ---------------------------------------------------------------------------
# Build (GitHub Pages builds this with the github-pages gem)
# ---------------------------------------------------------------------------

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
