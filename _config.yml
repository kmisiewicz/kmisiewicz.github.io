# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------

title: Krzysztof Misiewicz
tagline: Unity Developer # used in the home page browser-tab title
description: Portfolio of Krzysztof Misiewicz, a Unity developer building games, editor tools and VR projects.
url: https://kmisiewicz.github.io
baseurl: ""
lang: en
avatar: /images/author.jpg
logo: /images/author.jpg
author:
  name: Krzysztof Misiewicz

# Home page hero
headline: My portfolio
intro: >-
  I'm a Unity Developer with almost 5 years of commercial experience building PC and mobile games.
  Here are some projects I created in my free time.

# Accent palette: cyan, violet, amber, rose, lime, emerald, teal
accent: teal

# Icon links in the header, hero and footer. Leave a value empty to hide it.
socials:
  github: kmisiewicz
  linkedin: krzysztof-misiewicz
  email: k.misiewicz97@gmail.com
  soundcloud: crysis1331
  youtube: # channel handle, e.g. "@yourname"

# ---------------------------------------------------------------------------
# Build (GitHub Pages builds this with the github-pages gem)
# ---------------------------------------------------------------------------

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
