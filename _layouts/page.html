---
layout: default
---
<article class="page">
  <header class="post-header container container--narrow">
    {%- if page.image -%}
    <img class="page-portrait" src="{{ page.image | relative_url }}" alt="" width="96" height="96">
    {%- endif -%}
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.description -%}
    <p class="post-lead">{{ page.description }}</p>
    {%- endif -%}
  </header>

  <div class="prose container container--narrow">
    {{ content }}
  </div>
</article>
