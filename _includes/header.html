<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.avatar | relative_url }}" alt="" width="32" height="32">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}#projects"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
    {%- include social.html class="site-header__social" -%}
  </div>
</header>
